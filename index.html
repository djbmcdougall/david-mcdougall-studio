        <h1>David McDougall — Filmmaker &amp; AI Creative Director</h1>
        <p>Award-winning documentary filmmaker and AI Creative Director with 20+ years directing for BBC, Al Jazeera, Channel 4, PBS, Discovery, and National Geographic. Founder of Murmur Labs. One-man AI studio producing broadcast-quality documentary, branded content, and AI-native film.</p>
        <h2>About</h2>
        <p>War zones. Boardrooms. Milan catwalks and Manila slums. David McDougall has spent twenty years shooting, directing and producing for BBC, Al Jazeera, Channel 4, PBS, Discovery, National Geographic and Qatar Media Corporation.</p>
        <p>His first broadcast film, the multi-award-winning investigative documentary Afghan Massacre: The Convoy of Death, exposed the killing of Taliban prisoners by US-allied forces and aired on Channel 5, CBC, and ZDF. The Journey, his 15-part dual-language travel series for Al Jazeera, reached over 50 million viewers worldwide.</p>
        <p>From 2013 to 2022 he ran The Wired Agency as Executive Producer and Founder, generating over £1M in premium branded content and documentary for Qatar Foundation, Harrods, Land Rover, Qatar Airways, Emirates Airlines, Jumeirah and Armani.</p>
        <p>In 2023 he closed the agency and went solo. He now runs a one-man film and content studio at the frontier of AI-native production — using Sora, Runway, Kling, Higgsfield, ElevenLabs and Udio to deliver cinematic-grade video, synthetic voice, sound design and original music at broadcast quality, in days rather than weeks.</p>
        <p>He is also the founder of Murmur Labs, an AI product studio building voice-first verification infrastructure. Its flagship product, Murmur.Guide, uses the human voice as its core trust layer.</p>
        <h2>Services</h2>
        <ul>
          <li>AI Content Production — Sora, Runway, Kling, Higgsfield, ElevenLabs</li>
          <li>Broadcast Documentary — BBC, Al Jazeera, Channel 4, PBS, Discovery</li>
          <li>Branded Content — Emirates Airlines, Qatar Airways, Jumeirah, Armani, Harrods</li>
          <li>Brand Identity &amp; Design</li>
          <li>Straplines &amp; Brand Voice</li>

        </ul>
